{% extends "base.html" %}
{% block title %}Editar competencia · SwimPro{% endblock %}

{% block content %}
<div class="sp271-page">

  <section class="sp271-water-header">
    <a href="{{ url_for('competition_detail', competition_id=comp.id) }}"
       class="sp271-back" aria-label="Volver">
      <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
    </a>

    <span class="sp271-kicker">COMPETENCIA</span>
    <h1>Editar competencia</h1>
    <p>{{ comp.name }}</p>
  </section>

  {% if error %}
    <div class="sp271-error">{{ error }}</div>
  {% endif %}

  <form class="sp271-form" method="post">

    <label>
      <span>Nombre de la competencia</span>
      <input name="name" value="{{ comp.name }}" required>
    </label>

    <div class="sp271-two">
      <label>
        <span>Fecha</span>
        <div class="sp271-date">
          <input type="date"
                 name="competition_date"
                 value="{{ comp.competition_date }}"
                 required>
          <svg viewBox="0 0 24 24">
            <rect x="4" y="5" width="16" height="15" rx="2"/>
            <path d="M8 3v4M16 3v4M4 10h16"/>
          </svg>
        </div>
      </label>

      <label>
        <span>Piscina</span>
        <select name="pool_length">
          <option value="25" {% if comp.pool_length == 25 %}selected{% endif %}>
            25 m (Corta)
          </option>
          <option value="50" {% if comp.pool_length == 50 %}selected{% endif %}>
            50 m (Larga)
          </option>
        </select>
      </label>
    </div>

    <label>
      <span>Ubicación</span>
      <input name="location"
             value="{{ comp.location or '' }}"
             placeholder="Santiago, Chile">
    </label>

    <label>
      <span>Notas</span>
      <textarea name="notes"
                rows="5"
                placeholder="Notas adicionales (opcional)">{{ comp.notes or '' }}</textarea>
    </label>

    <button type="submit" class="sp271-save">
      <svg viewBox="0 0 24 24">
        <path d="M5 4h12l2 2v14H5z"/>
        <path d="M8 4v6h8V4M8 16h8"/>
      </svg>
      Guardar competencia
    </button>

  </form>

</div>
{% endblock %}
